<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Events</h2>

    {% if events %}
        <ul>
            {% for event in events %}
                <li>
                    {{ event.name }}
                    <a href="{% url 'event_register' event.id %}">Register</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No events available</p>
    {% endif %}

</body>
</html>
