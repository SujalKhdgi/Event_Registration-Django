version: "3.9"

services:
  web:
    build: .
    container_name: django_app
    env_file:
      - .env
    expose:
      - "8000"

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: antaragni_db
      POSTGRES_USER: antaragni_user
      POSTGRES_PASSWORD: antaragni_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./staticfiles:/app/staticfiles
    depends_on:
      - web


volumes:
  postgres_data:

